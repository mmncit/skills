name: Publish to skills.sh

on:
  push:
    branches: [main]
    paths:
      - "**/SKILL.md"
  workflow_dispatch:

jobs:
  validate:
    name: Validate skills
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Verify skills CLI discovers every skill (real YAML parse)
        run: |
          # The grep-based check below can't catch malformed YAML (e.g. an
          # unquoted ': ' in a description). The skills CLI uses a real YAML
          # parser and silently skips skills it can't parse, so assert that
          # the count it discovers matches the number of SKILL.md files.
          expected=$(find . -name "SKILL.md" -not -path "./.agents/*" -not -path "./.git/*" | wc -l | tr -d ' ')
          found=$(npx -y skills add . -l 2>&1 | grep -oE "Found [0-9]+ skill" | grep -oE "[0-9]+")
          echo "SKILL.md files: $expected | skills CLI discovered: $found"
          if [ "$expected" != "$found" ]; then
            echo "::error::skills CLI discovered $found of $expected skills — a SKILL.md likely has malformed YAML frontmatter (check for unquoted ': ' in description)"
            exit 1
          fi

      - name: Check SKILL.md files have required frontmatter
        run: |
          exit_code=0
          for skill in $(find . -name "SKILL.md" -not -path "./.agents/*" -not -path "./.git/*"); do
            dir=$(dirname "$skill")
            folder=$(basename "$dir")
            echo "Checking $skill (folder: $folder)..."

            # Check for frontmatter delimiters
            if ! head -1 "$skill" | grep -q "^---"; then
              echo "::error file=$skill::Missing YAML frontmatter"
              exit_code=1
              continue
            fi

            # Extract name field
            name=$(sed -n '/^---$/,/^---$/p' "$skill" | grep "^name:" | head -1 | sed 's/name: *//;s/^ *//;s/ *$//')
            if [ -z "$name" ]; then
              echo "::error file=$skill::Missing 'name' in frontmatter"
              exit_code=1
              continue
            fi

            # Check name matches folder
            if [ "$name" != "$folder" ]; then
              echo "::error file=$skill::name '$name' does not match folder '$folder'"
              exit_code=1
              continue
            fi

            # Check for description
            desc=$(sed -n '/^---$/,/^---$/p' "$skill" | grep "^description:")
            if [ -z "$desc" ]; then
              echo "::error file=$skill::Missing 'description' in frontmatter"
              exit_code=1
              continue
            fi

            echo "  ✓ $name"
          done
          exit $exit_code

  publish:
    name: Register with skills.sh
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install skills to trigger skills.sh registration
        run: npx -y skills add mmncit/skills -g -s '*' -y
