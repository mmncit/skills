name: Publish to skills.sh

on:
  push:
    branches: [main]
    paths:
      - "**/SKILL.md"
  workflow_dispatch:

jobs:
  validate:
    name: Validate skills
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      # Parse each SKILL.md's frontmatter with a real YAML parser. A grep-based
      # check can't catch malformed YAML (e.g. an unquoted ': ' in a
      # description), which the skills CLI silently skips at publish time —
      # the skill then never registers on skills.sh.
      - name: Validate SKILL.md frontmatter
        run: |
          npm install --no-save js-yaml@4
          node <<'EOF'
          const fs = require("fs");
          const path = require("path");
          const { execSync } = require("child_process");
          const yaml = require("js-yaml");

          const files = execSync(
            'find . -name SKILL.md -not -path "./.agents/*" -not -path "./.git/*"'
          ).toString().trim().split("\n").filter(Boolean);

          let failed = false;
          for (const file of files) {
            const folder = path.basename(path.dirname(file));
            const text = fs.readFileSync(file, "utf8");
            const m = text.match(/^---\n([\s\S]*?)\n---/);
            if (!m) { console.log(`::error file=${file}::Missing YAML frontmatter`); failed = true; continue; }

            let fm;
            try { fm = yaml.load(m[1]); }
            catch (e) { console.log(`::error file=${file}::Invalid YAML frontmatter: ${e.message.split("\n")[0]}`); failed = true; continue; }

            if (!fm || !fm.name) { console.log(`::error file=${file}::Missing 'name' in frontmatter`); failed = true; continue; }
            if (fm.name !== folder) { console.log(`::error file=${file}::name '${fm.name}' does not match folder '${folder}'`); failed = true; continue; }
            if (!fm.description) { console.log(`::error file=${file}::Missing 'description' in frontmatter`); failed = true; continue; }

            console.log(`  ✓ ${fm.name}`);
          }
          process.exit(failed ? 1 : 0);
          EOF

  publish:
    name: Register with skills.sh
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install skills to trigger skills.sh registration
        run: npx -y skills add mmncit/skills -g -s '*' -y
